<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Финн — шаг 1</title>
  <style>
    body { background: #222; color: #eee; font-family: sans-serif; text-align: center; }
    canvas { background: #f4e4c1; border: 4px solid #000; }
  </style>
</head>
<body>
  <h1>Финн — шаг 1</h1>
  <p>Нажимай стрелки ← и → на клавиатуре</p>

  <!-- canvas — это «холст», на котором мы рисуем игру -->
  <canvas id="game" width="800" height="400"></canvas>

  <script>
    // ===== ПОДГОТОВКА =====
    // Находим холст на странице и берём «кисточку» для рисования
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // ===== ПЕРЕМЕННЫЕ =====
    // Переменная — это коробочка с именем, в которой лежит значение.
    // Здесь хранится всё, что нужно знать о Финне:
    let x = 100;        // где Финн по горизонтали (0 = левый край)
    let y = 300;        // где Финн по вертикали (0 = верх экрана)
    let size = 50;      // размер квадратика
    let speed = 5;      // на сколько пикселей он сдвигается за один кадр

    // Какие клавиши сейчас нажаты (true = да, false = нет)
    let leftPressed = false;
    let rightPressed = false;

    // ===== УПРАВЛЕНИЕ =====
    // Когда клавишу НАЖАЛИ — запоминаем это
    document.addEventListener("keydown", function (event) {
      if (event.key === "ArrowLeft")  leftPressed = true;
      if (event.key === "ArrowRight") rightPressed = true;
    });

    // Когда клавишу ОТПУСТИЛИ — тоже запоминаем
    document.addEventListener("keyup", function (event) {
      if (event.key === "ArrowLeft")  leftPressed = false;
      if (event.key === "ArrowRight") rightPressed = false;
    });

    // ===== ИГРОВОЙ ЦИКЛ =====
    // Эта функция вызывается примерно 60 раз в секунду.
    // Каждый раз: 1) двигаем Финна, 2) рисуем всё заново.
    function gameLoop() {
      // 1) ДВИЖЕНИЕ
      if (leftPressed)  x = x - speed;   // влево — уменьшаем x
      if (rightPressed) x = x + speed;   // вправо — увеличиваем x

      // Не даём Финну убежать за края экрана
      if (x < 0) x = 0;
      if (x > canvas.width - size) x = canvas.width - size;

      // 2) РИСОВАНИЕ
      ctx.clearRect(0, 0, canvas.width, canvas.height); // стираем прошлый кадр

      ctx.fillStyle = "#6b4f2a";                        // цвет земли
      ctx.fillRect(0, 350, canvas.width, 50);           // рисуем землю

      ctx.fillStyle = "orange";                         // цвет Финна
      ctx.fillRect(x, y, size, size);                   // рисуем Финна

      // Просим браузер вызвать gameLoop ещё раз в следующем кадре
      requestAnimationFrame(gameLoop);
    }

    // Запускаем игру!
    gameLoop();
  </script>
</body>
</html>
